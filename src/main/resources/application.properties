spring.application.name=zuck-platform

server.port=8082
server.address=0.0.0.0

# Telegram Bot Configuration
telegram.bot.enabled=true
telegram.bot.polling-delay-ms=1000
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.allowed-user-id=${TELEGRAM_ALLOWED_USER_ID:0}
telegram.bot.allowed-chat-id=${TELEGRAM_ALLOWED_CHAT_ID:0}
telegram.bot.natural-language=${TELEGRAM_NATURAL_LANGUAGE:false}

# Active Project Context (the team persists; project context switches)
project.context.current-project-id=habit-coach-agent

# Registered External Projects
# Project 1: Habit Coach Agent
project.registry.projects.habit-coach-agent.id=habit-coach-agent
project.registry.projects.habit-coach-agent.name=Habit Coach Agent
project.registry.projects.habit-coach-agent.description=Telegram-based habit coaching platform
project.registry.projects.habit-coach-agent.repository=Anvarjon7/habit-coach-agent
project.registry.projects.habit-coach-agent.default-branch=main
project.registry.projects.habit-coach-agent.technologies[0]=Java
project.registry.projects.habit-coach-agent.technologies[1]=Spring Boot
project.registry.projects.habit-coach-agent.technologies[2]=PostgreSQL

# Project 2: AI Academy
project.registry.projects.ai-academy.id=ai-academy
project.registry.projects.ai-academy.name=AI Academy
project.registry.projects.ai-academy.description=Interactive educational platform for AI engineering
project.registry.projects.ai-academy.repository=Anvarjon7/ai-academy
project.registry.projects.ai-academy.default-branch=main
project.registry.projects.ai-academy.technologies[0]=TypeScript
project.registry.projects.ai-academy.technologies[1]=Next.js
project.registry.projects.ai-academy.technologies[2]=Python
